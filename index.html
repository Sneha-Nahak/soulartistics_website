<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="author" content="Soulartistics" />

    <!-- Google Search Console Verification -->
   <meta name="google-site-verification" content="ffiHgc1Zl-nUSnn8btdtdZAjqsiJaEfaUV8iWFiTYOc" />

    <!-- SEO -->
    <title>
      Soulartistics | Creative Design, Digital Art & Visual Experiences
    </title>

    <meta
      name="description"
      content="Soulartistics is a creative platform exploring graphic design, UI/UX design, digital art, visual creativity and unique digital experiences."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://soulartistics.vercel.app/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/soulartistics-logo-white.png"
    />

    <link
      rel="apple-touch-icon"
      href="/soulartistics-logo-white.png"
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Soulartistics | Creative Design, Digital Art & Visual Experiences"
    />

    <meta
      property="og:description"
      content="Explore Soulartistics — a creative platform for graphic design, UI/UX, digital art, visual creativity and unique digital experiences."
    />

    <meta
      property="og:url"
      content="https://soulartistics.vercel.app/"
    />

    <meta
      property="og:site_name"
      content="Soulartistics"
    />

    <meta
      property="og:image"
      content="https://soulartistics.vercel.app/soulartistics-logo-white.png"
    />

    <meta
      property="og:image:alt"
      content="Soulartistics logo"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Soulartistics | Creative Design, Digital Art & Visual Experiences"
    />

    <meta
      name="twitter:description"
      content="Discover Soulartistics — graphic design, UI/UX design, digital art, visual creativity and unique digital experiences."
    />

    <meta
      name="twitter:image"
      content="https://soulartistics.vercel.app/soulartistics-logo-white.png"
    />

    <meta
      name="twitter:image:alt"
      content="Soulartistics logo"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#1e1e1e"
    />

    <!-- Structured Data / Schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Soulartistics",
        "url": "https://soulartistics.vercel.app/",
        "description": "Soulartistics is a creative platform exploring graphic design, UI/UX design, digital art, visual creativity and unique digital experiences.",
        "publisher": {
          "@type": "Organization",
          "name": "Soulartistics",
          "url": "https://soulartistics.vercel.app/"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
